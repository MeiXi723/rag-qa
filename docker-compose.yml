version: "3.9"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - SQLITE_PATH=/app/data/rag.db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
